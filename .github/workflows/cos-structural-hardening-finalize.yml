name: cos-structural-hardening-finalize

on:
  push:
    branches:
      - agent/cos-v44-acp145-replay-hardening

permissions:
  contents: write

jobs:
  materialize-proven-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce exact already-proven repair candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          wf = Path('.github/workflows/cos-structural-hardening-repair.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          close = "\n          PY\n"
          chunks = wf.split(marker)[1:]
          if len(chunks) != 2:
              raise SystemExit(f'expected exactly two repair Python heredocs, found {len(chunks)}')
          for i, chunk in enumerate(chunks, start=1):
              if close not in chunk:
                  raise SystemExit(f'repair heredoc {i} has no terminator')
              code = dedent(chunk.split(close, 1)[0])
              exec(compile(code, f'proven-repair::<python-{i}>', 'exec'), {})
          PY

      - name: Commit exact candidate proven by full and targeted suites
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/cos/schema.ts \
            src/cos/progression-pipeline.ts \
            src/cos/action-authorization.ts \
            src/cos/executor-core.ts \
            src/__tests__/cos-executor.test.ts \
            src/__tests__/cos-gmail-send.test.ts \
            src/__tests__/cos-first-send-needs-a-decision.test.ts \
            src/__tests__/cos-outbound-claim-and-quota.test.ts \
            src/__tests__/cos-kill-switch.test.ts \
            src/__tests__/cos-tick.test.ts \
            scripts/cos-v145-hardening-acceptance.py
          if git diff --cached --quiet; then
            echo "No hardening changes to commit"
            exit 0
          fi
          git commit -m "hardening(cos): close structural hardening seams"
          git push origin HEAD:${GITHUB_REF_NAME}
