name: cos-structural-hardening-repair

on:
  push:
    branches:
      - agent/cos-v44-acp145-replay-hardening

permissions:
  contents: write

jobs:
  repair-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply base exact structural codemod
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          wf = Path('.github/workflows/cos-structural-hardening-codemod.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          if wf.count(marker) != 1:
              raise SystemExit(f'expected exactly one codemod heredoc, found {wf.count(marker)}')
          body = wf.split(marker, 1)[1]
          close = "\n          PY\n"
          if body.count(close) != 1:
              raise SystemExit(f'expected exactly one codemod heredoc terminator, found {body.count(close)}')
          code = dedent(body.split(close, 1)[0])
          exec(compile(code, 'cos-structural-hardening-codemod.yml::<python>', 'exec'), {})
          PY

      - name: Apply exact regression repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exact repair anchor once, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # TSCG remains central and unavoidable, but domain ownership must be
          # established first. Otherwise a Personal run aimed at a ZST case is
          # misreported as TEMPORAL_MISSING and masks CROSS_DOMAIN_LEAKAGE.
          generated_gate = (
              "  // ACP v1.4.5 TSCG_ENTRY_GUARD. This is inside the cycle body so a\n"
              "  // self-claimed caller holds the claim before the gate, while a caller\n"
              "  // that already owns the claim gets the same invariant. No direct/manual\n"
              "  // entry can route around temporal semantics.\n"
              "  const body = (): ProgressionRunResult => db.transaction(() => {\n"
              "    const temporal = evaluateCaseTemporalConsistency(db, domain, caseId, now)\n"
              "    if (!temporal.allowProgression) {\n"
              "      return recordRefusedRun(\n"
              "        db, randomUUID(), domain, caseId, 'TEMPORAL_GATE_BLOCKED',\n"
              "        `${temporal.status}: ${temporal.reasons.join('; ')}`, opts, now,\n"
              "      )\n"
              "    }\n"
              "    return runProgressionCycleInner(db, domain, caseId, now, opts)\n"
              "  })()\n"
          )
          plain_body = (
              "  const body = (): ProgressionRunResult => db.transaction(\n"
              "    () => runProgressionCycleInner(db, domain, caseId, now, opts),\n"
              "  )()\n"
          )
          replace_once('src/cos/progression-pipeline.ts', generated_gate, plain_body)
          inner_anchor = (
              "    throw new Error(`Case not found: ${domain}/${caseId}`)\n"
              "  }\n\n"
              "  // 2. Outcome contract — lazy enrichment: if goal was already set by\n"
          )
          inner_gate = (
              "    throw new Error(`Case not found: ${domain}/${caseId}`)\n"
              "  }\n\n"
              "  // ACP v1.4.5 TSCG_ENTRY_GUARD. Domain ownership is established above\n"
              "  // before temporal semantics are evaluated, so CROSS_DOMAIN_LEAKAGE and\n"
              "  // ordinary not-found behavior cannot be masked by TEMPORAL_MISSING. Every\n"
              "  // public progression entry still reaches this shared inner gate before\n"
              "  // outcome-contract, resolver, planning or policy decisions.\n"
              "  const temporal = evaluateCaseTemporalConsistency(db, domain, caseId, now)\n"
              "  if (!temporal.allowProgression) {\n"
              "    return recordRefusedRun(\n"
              "      db, runId, domain, caseId, 'TEMPORAL_GATE_BLOCKED',\n"
              "      `${temporal.status}: ${temporal.reasons.join('; ')}`, opts, now,\n"
              "    )\n"
              "  }\n\n"
              "  // 2. Outcome contract — lazy enrichment: if goal was already set by\n"
          )
          replace_once('src/cos/progression-pipeline.ts', inner_anchor, inner_gate)

          # Authorization identity/refusal wins over evidence diagnostics when no
          # ticket exists. A valid ticket is still consumed only after freshness.
          old = "      // ACP v1.4.5 OUTBOUND_EVIDENCE_FRESHNESS. Recovery states returned\n"
          new = (
              "      // Authorization identity is checked before evidence diagnostics. A missing\n"
              "      // ticket is refused by the canonical primitive without consuming anything.\n"
              "      if (!opts.authorizationId) {\n"
              "        const missing = consumeAuthorization(\n"
              "          db, undefined,\n"
              "          opts.authorizationContext ?? { ...EMPTY_AUTH_CONTEXT, actionId: ledgerId, actionType: a.actionType },\n"
              "          now,\n"
              "        )\n"
              "        if (!missing.ok) {\n"
              "          setStatus(db, ledgerId, a.status, { last_error: `refused: ${missing.reason}` }, now, a.status)\n"
              "          return loadOrThrow(db, ledgerId)\n"
              "        }\n"
              "      }\n"
              "      // ACP v1.4.5 OUTBOUND_EVIDENCE_FRESHNESS. Recovery states returned\n"
          )
          replace_once('src/cos/executor-core.ts', old, new)

          helper = "\n".join([
              "function ensureDraftEvidence(db: Parameters<typeof issueAuthorization>[0], ledgerId: string, now: number): { caseId: string; caseVersion: number } {",
              "  const row = db.prepare(`SELECT case_id, status, case_version FROM outbound_ledger WHERE ledger_id=?`).get(ledgerId) as",
              "    { case_id: string | null; status: string; case_version: number | null } | undefined",
              "  if (!row?.case_id) throw new Error(`test outbound ledger has no case_id: ${ledgerId}`)",
              "  const c = db.prepare(`SELECT version FROM personal_cases WHERE case_id=?`).get(row.case_id) as { version: number } | undefined",
              "  if (!c) throw new Error(`test case missing: ${row.case_id}`)",
              "  if (row.case_version == null) db.prepare(`UPDATE outbound_ledger SET case_version=? WHERE ledger_id=?`).run(c.version, ledgerId)",
              "  if (row.status === 'PLANNED' || row.status === 'FAILED_RETRYABLE') {",
              "    const exists = db.prepare(`SELECT 1 FROM personal_case_events WHERE case_id=? AND event_type='OUTBOUND_DRAFTED' AND source_reference=? LIMIT 1`).get(row.case_id, ledgerId)",
              "    if (!exists) appendCaseEvent(db, {",
              "      caseId: row.case_id, caseVersion: c.version, actor: 'test', eventType: 'OUTBOUND_DRAFTED',",
              "      reason: 'production-equivalent draft evidence horizon for executor fixture',",
              "      sourceSystem: 'test:executor', sourceReference: ledgerId, payload: { ledgerId },",
              "    }, now)",
              "  }",
              "  return { caseId: row.case_id, caseVersion: c.version }",
              "}",
              "",
              "",
          ])

          def patch_auth_fixture(path: str, import_old: str, import_new: str, signature: str, context_line: str) -> None:
              replace_once(path, import_old, import_new)
              replace_once(
                  path,
                  signature + "\n  const ctx = {\n" + context_line,
                  helper + signature + "\n  const evidence = ensureDraftEvidence(db, ledgerId, now)\n  const ctx = {\n"
                  + context_line.replace("caseId: null, caseVersion: null", "caseId: evidence.caseId, caseVersion: evidence.caseVersion"),
              )

          patch_auth_fixture(
              'src/__tests__/cos-gmail-send.test.ts',
              "import { createCase } from '../cos/case-store.js'\n",
              "import { createCase, appendCaseEvent } from '../cos/case-store.js'\n",
              "function authorized(db: Parameters<typeof issueAuthorization>[0], ledgerId: string, actionType: string, now: number) {",
              "    domain: 'personal' as const, caseId: null, caseVersion: null, goalVersion: null,\n",
          )
          patch_auth_fixture(
              'src/__tests__/cos-first-send-needs-a-decision.test.ts',
              "import { createCase } from '../cos/case-store.js'\n",
              "import { createCase, appendCaseEvent } from '../cos/case-store.js'\n",
              "function authorized(db: Parameters<typeof issueAuthorization>[0], ledgerId: string, now: number) {",
              "    domain: 'personal' as const, caseId: null, caseVersion: null, goalVersion: null,\n",
          )
          patch_auth_fixture(
              'src/__tests__/cos-outbound-claim-and-quota.test.ts',
              "import { createCase, acquireClaim } from '../cos/case-store.js'\n",
              "import { createCase, acquireClaim, appendCaseEvent } from '../cos/case-store.js'\n",
              "function authorized(db: Parameters<typeof issueAuthorization>[0], ledgerId: string, now: number) {",
              "    domain: 'personal' as const, caseId: null, caseVersion: null, goalVersion: null,\n",
          )
          patch_auth_fixture(
              'src/__tests__/cos-kill-switch.test.ts',
              "import { createCase } from '../cos/case-store.js'\n",
              "import { createCase, appendCaseEvent } from '../cos/case-store.js'\n",
              "function ticket(db: Parameters<typeof issueAuthorization>[0], ledgerId: string, now: number) {",
              "    domain: 'personal' as const, caseId: null, caseVersion: null, goalVersion: null,\n",
          )
          patch_auth_fixture(
              'src/__tests__/cos-tick.test.ts',
              "import { createCase, transitionCase } from '../cos/case-store.js'\n",
              "import { createCase, transitionCase, appendCaseEvent } from '../cos/case-store.js'\n",
              "function authorized(db: Parameters<typeof issueAuthorization>[0], ledgerId: string, now: number) {",
              "    domain: 'personal' as const, caseId: null, caseVersion: null, goalVersion: null,\n",
          )
          PY

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Hardening acceptance
        run: python3 scripts/cos-v145-hardening-acceptance.py --json

      - name: Full suite
        run: npx vitest run

      - name: Commit only fully proven hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/cos/schema.ts \
            src/cos/progression-pipeline.ts \
            src/cos/action-authorization.ts \
            src/cos/executor-core.ts \
            src/__tests__/cos-executor.test.ts \
            src/__tests__/cos-gmail-send.test.ts \
            src/__tests__/cos-first-send-needs-a-decision.test.ts \
            src/__tests__/cos-outbound-claim-and-quota.test.ts \
            src/__tests__/cos-kill-switch.test.ts \
            src/__tests__/cos-tick.test.ts \
            scripts/cos-v145-hardening-acceptance.py
          if git diff --cached --quiet; then
            echo "No hardening changes to commit"
            exit 0
          fi
          git commit -m "hardening(cos): apply structural hardening seams"
          git push origin HEAD:${GITHUB_REF_NAME}
