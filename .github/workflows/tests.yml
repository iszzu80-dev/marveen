# The typecheck and the suite, on a machine that is nobody's.
#
# WHY. As of 2026-08-14 this repo had a pull_request_template.md and no
# workflows at all: the PR process had a form to fill in and no gate behind it.
# Every "6811 green" in every audit came from one laptop, and the APG kernel
# repo showed what that costs -- its default branch had been unrunnable for
# days without anyone being wrong about it.
#
# COST STRUCTURE, 2026-08-31 (card d3dff901, owner ruling with the Checkpoint E
# candidate). The budget hit 90% of $35 the night before, and the shape of the
# spend was never measured. Four things were paying for nothing:
#
#   1. `push: ['**']` + `pull_request` ran the SAME sha twice on every PR
#      branch. The second run proved nothing the first did not.
#   2. No `concurrency`, so a rapid series of pushes ran a full suite for every
#      intermediate commit, including the ones already superseded.
#   3. A markdown-only commit ran 8000 tests.
#   4. Every dev push to a scratch branch ran the whole heavy suite.
#
# TRIGGERS, 2026-10-24: the workflow no longer runs on push or tags. It runs
# when the `ci` label is added to a pull request, or from workflow_dispatch.
# The push-only `release-gate` job was removed with the push trigger.

name: tests

on:
  # Runs only when the `ci` label is added to a pull request (remove and re-add
  # the label to run it again), or manually from the Actions tab.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      full:
        description: 'Force the full suite regardless of paths'
        type: boolean
        default: true

# One run per ref; a newer run supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, always reports. A `paths-ignore` at the workflow level would
  # have left required checks permanently pending on a docs-only PR -- a gate
  # that never reports is indistinguishable from one that never passes.
  triage:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      heavy: ${{ steps.decide.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: changed
        name: What changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A first push to a branch, or a force-push, has no usable base.
          # Unknown provenance is treated as CODE, never as docs: guessing wrong
          # in the cheap direction is how a suite stops running.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "files=UNKNOWN" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$base" "${{ github.sha }}" > /tmp/changed.txt
            echo "files=LIST" >> "$GITHUB_OUTPUT"
            echo "--- changed files ---"; cat /tmp/changed.txt
          fi

      - id: decide
        name: Decide what this run owes
        run: |
          release=false
          case "${{ github.ref }}" in
            refs/heads/develop|refs/heads/main|refs/tags/*) release=true ;;
          esac
          [ "${{ github.event_name }}" = "pull_request" ] && release=true
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && release=true

          code=true
          if [ "${{ steps.changed.outputs.files }}" = "LIST" ]; then
            # Docs-only, and the pattern is ANCHORED on purpose. An earlier
            # cut of this line matched `docs/` anywhere in a path, so
            # `src/docs/foo.ts` classified as documentation and would have
            # skipped the suite; and it exempted `.md` at any depth, so a
            # markdown FIXTURE a test reads would have done the same. Only
            # repo-root markdown, docs/ and deliverables/ are runtime-free.
            if ! grep -qvE '^(docs|deliverables)/|^[^/]*\.md$|^LICENSE$' /tmp/changed.txt; then
              code=false
            fi
          fi

          # THE DEDUP, and it is the whole saving. ONE heavy run per sha:
          #   - a labeled PR (or a manual dispatch) owes the suite -> `suite`
          heavy=false
          case "${{ github.event_name }}" in
            pull_request|workflow_dispatch) [ "$code" = "true" ] && heavy=true ;;
          esac

          echo "code=$code"   >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "::notice::code=$code heavy=$heavy release=$release event=${{ github.event_name }} ref=${{ github.ref }}"

  suite:
    needs: triage
    if: needs.triage.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'      # package.json engines: >=20 <24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Suite
        run: npx vitest run

  # The two-repo vocabulary contract (APG_CHECKPOINT_RESULTS vs the kernel's
  # RESULT_VALUES) lives half in each repo, and its only guard is a test that
  # SKIPS when the kernel is not checked out. `APG_REQUIRE_KERNEL_CONTRACT=1`
  # turns that skip into a failure -- and until this job existed, that variable
  # was set in exactly zero places, so the guard had never once been enforced.
  #
  # Kept a SEPARATE job on purpose. Reaching a second private repo needs a PAT;
  # if the secret is absent this job is skipped and says so in the checks list,
  # which is a visible gap. Folding it into `suite` would have made a missing
  # secret look like a passing contract -- the exact shape of bug this job
  # exists to catch.
  #
  # Gated on `code` only, never on `heavy`: the contract is cheap (one test
  # file) and it is the one guard whose absence is invisible, so it does not
  # get to be skipped for being on a side branch.
  kernel-contract:
    needs: triage
    if: needs.triage.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: marveen-private

      - name: Check out the kernel
        id: kernel
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: iszzu80-dev/marveen-apg-kernel
          # Default branch on purpose: the contract must hold against what the
          # kernel actually ships, not against a branch chosen to make it pass.
          token: ${{ secrets.KERNEL_REPO_TOKEN }}
          path: marveen-apg-kernel

      - name: Announce which mode this run is in
        run: |
          if [ "${{ steps.kernel.outcome }}" = "success" ]; then
            echo "::notice::kernel checked out -- contract will be ENFORCED"
          else
            echo "::warning::KERNEL_REPO_TOKEN missing or checkout failed -- the two-repo contract is NOT verified by this run"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marveen-private/package-lock.json

      - working-directory: marveen-private
        run: npm ci

      - name: Contract test, strict
        working-directory: marveen-private
        env:
          APG_REQUIRE_KERNEL_CONTRACT: '1'
          APG_KERNEL_SRC_ROOT: ${{ github.workspace }}/marveen-apg-kernel/src
        run: npx vitest run src/__tests__/apg-projection-contract.test.ts
