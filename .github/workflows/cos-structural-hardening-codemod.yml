name: cos-structural-hardening-codemod

on:
  push:
    branches:
      - agent/cos-v44-acp145-replay-hardening

permissions:
  contents: write

jobs:
  patch-and-prove:
    # One shot: the commit created by this job must not invoke the codemod again.
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'apply structural hardening seams')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact structural patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exact patch anchor once, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Root CoS schema owns the new shared hardening tables.
          replace_once(
              'src/cos/schema.ts',
              "import { ensureLadderSchema } from './autonomy-ladder.js'\n"
              "import { ensureQuoteSchema } from './quote-campaign.js'\n"
              "import { ensureEnvelopeSchema } from './delegation-envelope.js'\n",
              "import { ensureLadderSchema } from './autonomy-ladder.js'\n"
              "import { ensureQuoteSchema } from './quote-campaign.js'\n"
              "import { ensureEnvelopeSchema } from './delegation-envelope.js'\n"
              "import { ensureTemporalFactsSchema } from './temporal-facts.js'\n"
              "import { ensureFeatureRunSchema } from './consumer-manifest.js'\n",
          )
          replace_once(
              'src/cos/schema.ts',
              "  ensureEnvelopeSchema(db)\n\n  // ── personal_cases",
              "  ensureEnvelopeSchema(db)\n"
              "  // v4.4/v1.4.5 shared hardening schema belongs to the root CoS seam.\n"
              "  ensureTemporalFactsSchema(db)\n"
              "  ensureFeatureRunSchema(db)\n\n"
              "  // ── personal_cases",
          )

          # 2) TSCG becomes structural for every progression entry.
          replace_once(
              'src/cos/progression-pipeline.ts',
              "import { CASE_STATUSES } from './schema.js'\n",
              "import { CASE_STATUSES } from './schema.js'\n"
              "import { evaluateCaseTemporalConsistency } from './temporal-consistency-gate.js'\n",
          )
          replace_once(
              'src/cos/progression-pipeline.ts',
              "  const body = (): ProgressionRunResult => db.transaction(\n"
              "    () => runProgressionCycleInner(db, domain, caseId, now, opts),\n"
              "  )()\n",
              "  // ACP v1.4.5 TSCG_ENTRY_GUARD. This is inside the cycle body so a\n"
              "  // self-claimed caller holds the claim before the gate, while a caller\n"
              "  // that already owns the claim gets the same invariant. No direct/manual\n"
              "  // entry can route around temporal semantics.\n"
              "  const body = (): ProgressionRunResult => db.transaction(() => {\n"
              "    const temporal = evaluateCaseTemporalConsistency(db, domain, caseId, now)\n"
              "    if (!temporal.allowProgression) {\n"
              "      return recordRefusedRun(\n"
              "        db, randomUUID(), domain, caseId, 'TEMPORAL_GATE_BLOCKED',\n"
              "        `${temporal.status}: ${temporal.reasons.join('; ')}`, opts, now,\n"
              "      )\n"
              "    }\n"
              "    return runProgressionCycleInner(db, domain, caseId, now, opts)\n"
              "  })()\n",
          )

          # 3) Outbound freshness belongs at the shared FIRST/RETRY DELIVERY
          # chokepoint, not inside the generic authorization primitive.
          replace_once(
              'src/cos/action-authorization.ts',
              "import { randomBytes, createHash } from 'node:crypto'\n"
              "import { assertOutboundEvidenceFresh } from './outbound-evidence-freshness.js'\n",
              "import { randomBytes, createHash } from 'node:crypto'\n",
          )
          replace_once(
              'src/cos/action-authorization.ts',
              "    // ACP v1.4.5 OUTBOUND_EVIDENCE_FRESHNESS.\n"
              "    //\n"
              "    // The authorization ticket proves that policy allowed the action; it does\n"
              "    // not prove the evidence the payload was prepared from is still current.\n"
              "    // Both Personal and ZST bind actionId to the exact outbound ledger id, so the\n"
              "    // shared consume chokepoint can re-check plan-time case_version and the\n"
              "    // OUTBOUND_DRAFTED event horizon immediately before first/retry delivery.\n"
              "    // Recovery/settlement states are explicitly NOT_APPLICABLE in the evaluator\n"
              "    // because they create no new provider side effect and must remain recoverable.\n"
              "    if (ctx.actionType === 'EMAIL_SEND') {\n"
              "      try {\n"
              "        assertOutboundEvidenceFresh(db, ctx.domain, ctx.actionId)\n"
              "      } catch (err) {\n"
              "        return { ok: false, reason: String((err as Error)?.message ?? err) }\n"
              "      }\n"
              "    }\n\n",
              "",
          )
          replace_once(
              'src/cos/executor-core.ts',
              "import { consumeAuthorization, type AuthorizationContext } from './action-authorization.js'\n"
              "import { killSwitchRefusal } from './kill-switch.js'\n",
              "import { consumeAuthorization, type AuthorizationContext } from './action-authorization.js'\n"
              "import { killSwitchRefusal } from './kill-switch.js'\n"
              "import { assertOutboundEvidenceFresh } from './outbound-evidence-freshness.js'\n",
          )
          replace_once(
              'src/cos/executor-core.ts',
              "      // §22.2. Consumed HERE, not at the door: between the gate's decision and\n"
              "      // this line the process may have been restarted, the row re-queued, or the\n"
              "      // payload edited. Consumption is the moment the authority is actually\n"
              "      // spent, so it belongs where the send begins.\n"
              "      const consumed = consumeAuthorization(\n",
              "      // ACP v1.4.5 OUTBOUND_EVIDENCE_FRESHNESS. Recovery states returned\n"
              "      // above; this is the common Personal/ZST first-or-retry delivery door.\n"
              "      // Evidence is revalidated BEFORE the ticket is consumed, so a stale\n"
              "      // payload neither calls the provider nor burns otherwise valid authority.\n"
              "      if (a.actionType === 'EMAIL_SEND') {\n"
              "        const evidenceDomain = T === 'outbound_ledger' ? 'personal'\n"
              "          : T === 'zst_outbound_ledger' ? 'zst' : null\n"
              "        if (!evidenceDomain) {\n"
              "          setStatus(db, ledgerId, a.status, { last_error: `refused: unknown email ledger ${T}` }, now, a.status)\n"
              "          return loadOrThrow(db, ledgerId)\n"
              "        }\n"
              "        try {\n"
              "          assertOutboundEvidenceFresh(db, evidenceDomain, ledgerId)\n"
              "        } catch (err) {\n"
              "          setStatus(db, ledgerId, a.status, { last_error: `refused: ${String((err as Error)?.message ?? err)}` }, now, a.status)\n"
              "          return loadOrThrow(db, ledgerId)\n"
              "        }\n"
              "      }\n"
              "      // §22.2. Consumed HERE, not at the door: between the gate's decision and\n"
              "      // this line the process may have been restarted, the row re-queued, or the\n"
              "      // payload edited. Consumption is the moment the authority is actually\n"
              "      // spent, so it belongs where the send begins.\n"
              "      const consumed = consumeAuthorization(\n",
          )

          # Executor state-machine tests bypass send-flow by design; explicitly
          # build the same draft evidence horizon production builds before first send.
          replace_once(
              'src/__tests__/cos-executor.test.ts',
              "import { createCase } from '../cos/case-store.js'\n",
              "import { createCase, appendCaseEvent } from '../cos/case-store.js'\n",
          )
          replace_once(
              'src/__tests__/cos-executor.test.ts',
              "const exec: typeof executeAction = (db, adapter, ledgerId, now, opts = {}) =>\n"
              "  executeAction(db, adapter, ledgerId, now, {\n"
              "    ...authorized(db, ledgerId, 'EMAIL_SEND', now), ...opts,\n"
              "  })\n",
              "function ensureDraftEvidence(db: Parameters<typeof issueAuthorization>[0], ledgerId: string, now: number): void {\n"
              "  const row = db.prepare(`SELECT case_id, status, case_version FROM outbound_ledger WHERE ledger_id=?`).get(ledgerId) as\n"
              "    { case_id: string | null; status: string; case_version: number | null } | undefined\n"
              "  if (!row || !row.case_id || (row.status !== 'PLANNED' && row.status !== 'FAILED_RETRYABLE')) return\n"
              "  const c = db.prepare(`SELECT version FROM personal_cases WHERE case_id=?`).get(row.case_id) as { version: number } | undefined\n"
              "  if (!c) throw new Error(`test case missing: ${row.case_id}`)\n"
              "  if (row.case_version == null) db.prepare(`UPDATE outbound_ledger SET case_version=? WHERE ledger_id=?`).run(c.version, ledgerId)\n"
              "  const exists = db.prepare(`SELECT 1 FROM personal_case_events WHERE case_id=? AND event_type='OUTBOUND_DRAFTED' AND source_reference=? LIMIT 1`).get(row.case_id, ledgerId)\n"
              "  if (!exists) appendCaseEvent(db, {\n"
              "    caseId: row.case_id, caseVersion: c.version, actor: 'test', eventType: 'OUTBOUND_DRAFTED',\n"
              "    reason: 'executor unit fixture: production-equivalent draft evidence horizon',\n"
              "    sourceSystem: 'test:executor', sourceReference: ledgerId, payload: { ledgerId },\n"
              "  }, now)\n"
              "}\n\n"
              "const exec: typeof executeAction = (db, adapter, ledgerId, now, opts = {}) => {\n"
              "  ensureDraftEvidence(db, ledgerId, now)\n"
              "  return executeAction(db, adapter, ledgerId, now, {\n"
              "    ...authorized(db, ledgerId, 'EMAIL_SEND', now), ...opts,\n"
              "  })\n"
              "}\n",
          )

          # Acceptance: central pipeline gate covers all callers; external
          # freshness must be in executor-core, while authorization stays generic.
          replace_once(
              'scripts/cos-v145-hardening-acceptance.py',
              "        calls = progression_calls()\n"
              "        unguarded: list[str] = []\n"
              "        for hit in calls:\n"
              "            rel = hit.split(\":\", 1)[0]\n"
              "            text = read(rel)\n"
              "            if rel == \"src/cos/progression-heartbeat.ts\" and \"evaluateCaseTemporalConsistency\" in text:\n"
              "                continue\n"
              "            # A future safe wrapper can make its proof explicit with this marker.\n"
              "            if \"TSCG_ENTRY_GUARD\" in text and \"evaluateCaseTemporalConsistency\" in text:\n"
              "                continue\n"
              "            unguarded.append(hit)\n",
              "        calls = progression_calls()\n"
              "        pipeline = read(\"src/cos/progression-pipeline.ts\")\n"
              "        central_gate = (\"TSCG_ENTRY_GUARD\" in pipeline\n"
              "                        and \"evaluateCaseTemporalConsistency\" in pipeline)\n"
              "        unguarded: list[str] = []\n"
              "        for hit in calls:\n"
              "            if central_gate:\n"
              "                continue\n"
              "            rel = hit.split(\":\", 1)[0]\n"
              "            text = read(rel)\n"
              "            if rel == \"src/cos/progression-heartbeat.ts\" and \"evaluateCaseTemporalConsistency\" in text:\n"
              "                continue\n"
              "            if \"TSCG_ENTRY_GUARD\" in text and \"evaluateCaseTemporalConsistency\" in text:\n"
              "                continue\n"
              "            unguarded.append(hit)\n",
          )
          replace_once(
              'scripts/cos-v145-hardening-acceptance.py',
              "        auth = read(\"src/cos/action-authorization.ts\")\n"
              "        executor = read(\"src/cos/executor-core.ts\")\n"
              "        marker = \"OUTBOUND_EVIDENCE_FRESHNESS\"\n"
              "        covered = marker in auth and \"consumeAuthorization\" in auth and \"consumeAuthorization\" in executor\n"
              "        checks.append(Check(\n"
              "            \"EV-EXT\", \"PASS\" if covered else \"FAIL\", \"P1\",\n"
              "            \"first/retry external email delivery revalidates draft evidence at shared authorization/admission chokepoint\",\n"
              "            [\"src/cos/action-authorization.ts\", \"src/cos/executor-core.ts\"] if covered\n"
              "            else [f\"missing shared marker {marker} in action-authorization consume path\"],\n"
              "        ))\n",
              "        auth = read(\"src/cos/action-authorization.ts\")\n"
              "        executor = read(\"src/cos/executor-core.ts\")\n"
              "        marker = \"OUTBOUND_EVIDENCE_FRESHNESS\"\n"
              "        covered = (marker in executor and \"assertOutboundEvidenceFresh\" in executor\n"
              "                   and \"consumeAuthorization\" in executor and \"adapter.send\" in executor\n"
              "                   and \"assertOutboundEvidenceFresh\" not in auth)\n"
              "        checks.append(Check(\n"
              "            \"EV-EXT\", \"PASS\" if covered else \"FAIL\", \"P1\",\n"
              "            \"first/retry external email delivery revalidates draft evidence at shared executor admission chokepoint\",\n"
              "            [\"src/cos/executor-core.ts\", \"src/cos/action-authorization.ts\"] if covered\n"
              "            else [f\"missing shared marker {marker} in executor or authorization is coupled to outbound evidence\"],\n"
              "        ))\n",
          )
          PY

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Hardening acceptance
        run: python3 scripts/cos-v145-hardening-acceptance.py --json

      - name: Full suite
        run: npx vitest run

      - name: Commit proven structural patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cos/schema.ts src/cos/progression-pipeline.ts src/cos/action-authorization.ts src/cos/executor-core.ts src/__tests__/cos-executor.test.ts scripts/cos-v145-hardening-acceptance.py
          if git diff --cached --quiet; then
            echo "No codemod changes to commit"
            exit 0
          fi
          git commit -m "hardening(cos): apply structural hardening seams"
          git push origin HEAD:${GITHUB_REF_NAME}
